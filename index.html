<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoyageFlow AI — Demonstração</title><style>body{margin:0;background:#10192d;color:#f6f8ff;font:16px/1.6 system-ui}main{max-width:680px;margin:50px auto;padding:24px}form{background:#1b2943;padding:28px;border-radius:18px;display:grid;gap:14px}input,textarea,button{padding:13px;border-radius:9px;border:1px solid #61718e;font:inherit}button{background:#9ae6d1;color:#10202c;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#253652;padding:20px;border-radius:12px}p{color:#b9c9e1}</style></head><body><main><h1>VoyageFlow AI</h1><p>Demonstração local com dados fictícios. A classificação usa regras; integração com LLM e painel administrativo são etapas futuras.</p><form id="form"><label>Destino<input name="destino" required maxlength="100" placeholder="Lisboa"></label><label>Período<input name="periodo" required maxlength="100" placeholder="Janeiro"></label><label>Viajantes<input name="viajantes" type="number" min="1" max="30" value="2" required></label><label>Solicitação<textarea name="mensagem" required maxlength="3000" rows="4" placeholder="Quero um orçamento para viajar em janeiro"></textarea></label><button>Gerar protocolo e analisar</button></form><h2>Resultado</h2><pre id="result">Preencha o formulário para começar.</pre></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const out=document.querySelector('#result');out.textContent='Analisando...';try{const r=await fetch('/api/solicitacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});out.textContent=JSON.stringify(await r.json(),null,2)}catch{out.textContent='Não foi possível conectar ao servidor local.'}})</script></body></html>
